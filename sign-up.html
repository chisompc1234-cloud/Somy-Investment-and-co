<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial=1.0">
        <title lang="en">Somy portal</title>
        <style>
            label {display: block;}
            div {margin: 15px 0;}
            body {text-align: center; background-color: bisque;}
            h1 {color: brown;}
            h2 {color: darkred;}
            button {font-weight: 800;}
            section {margin: 30px 0;}
        </style>
    </head>
    <body lang="en">
        <section>
        <h1>Somy Investment and co.</h1>
        <h2>Sign up</h2>
        <h3>Create an Account</h3>
        </section>
        <main>
        <form>
            <div>
            <label for="fullname">FULL NAME</label>
            <input type="text" placeholder="enter name" size="35" id="fullname" name="fullname">
            </div>
            <div>
            <label for="username">USERNAME</label>
                <small>should include numbers e.g john14</small><br>
            <input type="text" placeholder="e.g john14" size="35" id="username" name="username">
            </div>
            <div>
                <label for="email-address">EMAIL ADDRESS</label>
                <input type="email" placeholder="enter email" size="35" id="email-address" name="email address">
            </div>
            <div>
                <label for="new-password">NEW PASSWORD</label>
                <input type="password" placeholder="enter password" size="35" id="new-password" name="new password">
            </div>
            <div>
                <label for="confirm password">CONFIRM PASSWORD</label>
                <input type="password" placeholder="confirm password" size="35" id="confirm password" name="confirm password">
            </div>
            <div>
                <label for="Agreement">
                    <input type="checkbox" id="Agreement" name="Agreement">I agree to the terms and Conditions.
                </label>
            </div>
            <div>
            <button type="submit">Create Account</button>
            </div>
        </form>
        </main>
        <div>
        <button><a href="index.html">Back</a></button>
        </div>
        <footer>
        &copy; Somy Investment&co.2026
        </footer>
    </body>
</html>
